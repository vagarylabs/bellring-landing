# Image build and push workflow (formerly: Cosign image signing, ADR-041).
#
# SIGNING IS SUSPENDED (25 Nov 2026, security exception): the cosign PRIVATE key is retired from CI.
# This workflow no longer reads the cosign private-key or passphrase secrets, signs nothing and
# attaches no SBOM attestation. It still builds and pushes the image. Signing returns only through
# the shared hosted signer redesign, which is a separate, parked change.
#
# Consequence, intended: a digest built here is UNSIGNED, so any consumer that requires a signature
# refuses it. Digests signed before the retirement still verify with the legacy PUBLIC key, which
# needs no private half.
#
# Required GitHub secrets: GITHUB_TOKEN only (GHCR push).

name: Image build and push (cosign signing suspended)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-sign-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
